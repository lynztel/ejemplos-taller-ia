<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102e36">
  <title>Presentación · Clases de inglés</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hyperframes/player"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; color: #f4f6f1; background: #102e36; font-family: Arial, sans-serif; }
    main { width: min(1180px, 100%); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 0 0 16px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); }
    p { margin: 8px 0 18px; color: #c5d7d0; line-height: 1.5; }
    a { color: #c9f279; }
    hyperframes-slideshow { display: block; min-height: 520px; }
    hyperframes-player { display: block; width: 100%; height: min(70vh, 640px); min-height: 460px; border: 1px solid #37676a; border-radius: 18px; overflow: hidden; background: #102e36; }
    @media (max-width: 650px) { body { padding: 12px; } hyperframes-player { min-height: 360px; height: 62vh; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>De las horas al ingreso mensual</h1>
        <p>Explora la comparación con los controles de la presentación. Usa ← / → o los botones para cambiar de escena; pulsa P para presentar.</p>
      </div>
      <a href="./dashboard-clases-ingles.html">Volver al dashboard</a>
    </header>
    <hyperframes-slideshow>
      <hyperframes-player src="./presentacion/composition/index.html" controls></hyperframes-player>
    </hyperframes-slideshow>
  </main>
</body>
</html>
